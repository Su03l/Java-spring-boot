<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>إدخال بيانات الموظف</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen m-0">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">فورم بيانات الموظف</h2>

        <form action="/addStaff" method="post" class="space-y-5">
            <div>
                <label for="staffName" class="block text-gray-700 font-semibold mb-2">اسم الموظف</label>
                <input type="text" id="staffName" name="staffName" placeholder="ادخل الاسم هنا" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition duration-200">
            </div>

            <div>
                <label for="jobTitle" class="block text-gray-700 font-semibold mb-2">المسمى الوظيفي</label>
                <input type="text" id="jobTitle" name="jobTitle" placeholder="مثال: مطور برامج" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition duration-200">
            </div>

            <div>
                <label for="salary" class="block text-gray-700 font-semibold mb-2">الراتب</label>
                <input type="number" id="salary" name="salary" placeholder="ادخل الراتب" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition duration-200">
            </div>

            <button type="submit"
                class="w-full bg-green-500 text-white font-bold py-3 px-4 rounded-md hover:bg-green-600 focus:outline-none focus:ring-4 focus:ring-green-300 transition duration-300">
                إرسال
            </button>
        </form>

        <div th:if="${staff != null}" class="mt-6 p-4 bg-gray-50 border border-gray-200 rounded-md">
            <h3 class="text-lg font-semibold text-gray-800 mb-2">بيانات الموظف الحالية:</h3>
            <p class="text-gray-700"><span class="font-bold">الاسم:</span> <span th:text="${staff.staffName}"></span></p>
            <p class="text-gray-700"><span class="font-bold">المسمى الوظيفي:</span> <span th:text="${staff.staffPosition}"></span></p>
            <p class="text-gray-700"><span class="font-bold">الراتب:</span> <span th:text="${staff.staffSalary}"></span></p>
        </div>
    </div>

</body>
</html>
